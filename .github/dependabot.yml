version: 2
# Version cooldowns do not delay security updates; enable security updates in repository settings.
# https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      npm-workspace:
        applies-to: version-updates
        patterns: ["*"]
      npm-workspace-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: "gomod"
    directory: "/apps/server"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      go-module:
        applies-to: version-updates
        patterns: ["*"]
      go-module-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      containers:
        applies-to: version-updates
        patterns: ["*"]
      containers-security:
        applies-to: security-updates
        patterns: ["*"]
